name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      uses: cmake -B build

    - name: build
      run: cmake --build build

    - name: Run tests
      run: ./build/tests
